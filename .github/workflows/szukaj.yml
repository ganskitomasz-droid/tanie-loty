name: Szukaj tanich lotów
# Wyniki: https://ganskitomasz-droid.github.io/tanie-loty/

on:
  schedule:
    - cron: "17 */6 * * *"   # co 6 godzin (czas UTC)
  push:
    branches: [main]
    paths: ["tanie_loty/**", "site/**", "config.json", ".github/workflows/szukaj.yml"]
  workflow_dispatch:
    inputs:
      months:
        description: "Ile miesięcy do przodu"
        required: false
      nights_min:
        description: "Minimum nocy"
        required: false
      nights_max:
        description: "Maksimum nocy"
        required: false
      max_total:
        description: "Maks. cena całej podróży w PLN (0 = bez limitu)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: szukaj
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [WAW, KRK, KTW, WRO, GDN, POZ]   # miejsca wylotu z config.json → groups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pamięć podręczna (klimat, centra miast, poziom cen, noclegi)
        uses: actions/cache@v4
        with:
          path: cache
          key: enrich-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: |
            enrich-${{ matrix.group }}-
            enrich-
      - name: Wyszukiwanie (${{ matrix.group }})
        env:
          IN_MONTHS: ${{ inputs.months }}
          IN_NMIN: ${{ inputs.nights_min }}
          IN_NMAX: ${{ inputs.nights_max }}
          IN_MAX: ${{ inputs.max_total }}
          LITEAPI_KEY: ${{ secrets.LITEAPI_KEY }}
        run: |
          python -m tanie_loty --out public --group "${{ matrix.group }}" --months "$IN_MONTHS" \
            --nights-min "$IN_NMIN" --nights-max "$IN_NMAX" --max-total "$IN_MAX"
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.group }}
          path: public
          retention-days: 2

  publish:
    needs: search
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: public
          merge-multiple: true
      - name: Strona
        run: |
          cp site/index.html public/index.html
          python -m tanie_loty.compare public || true
          ls -la public
          test -f public/results.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
