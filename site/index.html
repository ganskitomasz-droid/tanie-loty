<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanie loty</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #fff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e4e2db;
    --accent: #0b5cff; --fr: #073590; --wz: #c6007e; --good: #0a7a3d; --chip: #efede6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131312; --card: #1d1d1b; --ink: #f1efe8; --muted: #9a988f; --line: #2f2e2a;
            --accent: #6d9bff; --fr: #7ea2ff; --wz: #ff6fc4; --good: #4fd18b; --chip: #2a2926; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  header { padding: 28px 20px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin-top: 4px; font-size: 14px; }
  .cities { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .cities a { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 5px 12px;
              border-radius: 999px; text-decoration: none; font-size: 14px; }
  .cities a.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cities small { opacity: .75; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
  .tabs { display: flex; gap: 6px; margin: 18px 0 12px; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px;
         border-radius: 999px; cursor: pointer; font: inherit; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tab small { opacity: .65; margin-left: 4px; }
  .filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
             background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
  .filters .reset { align-self: end; }
  .filters label.check { flex-direction: row; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); }
  input, select { font: inherit; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line);
                  background: var(--bg); color: var(--ink); min-width: 0; }
  .note { margin: 12px 2px 0; padding: 10px 14px; border-radius: 10px; font-size: 14px;
          background: #fff4d6; color: #6b4e00; }
  @media (prefers-color-scheme: dark) { .note { background: #3a3110; color: #f3d77a; } }
  .note[hidden] { display: none; }
  .price .pp { display: block; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .book { margin-top: 2px; font-size: 14px; }
  .book a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .badge { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .badge.good { color: var(--good); font-weight: 600; } .badge.bad { color: #c0392b; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .badge.bad { color: #ff7b6b; } }
  .price .cost { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); margin-top: 8px;
                 letter-spacing: 0; line-height: 1.3; cursor: help; }
  .price .cost small { font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .count { color: var(--muted); font-size: 13px; margin: 14px 2px 8px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .trip { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
          display: grid; grid-template-columns: 110px 1fr 250px; gap: 6px 18px; align-items: start; }
  .trip.noh { grid-template-columns: 110px 1fr; }
  .hotel { grid-column: 3; grid-row: 1 / span 2; border-left: 1px solid var(--line); padding-left: 16px;
           font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; height: 100%; }
  .hotel b { color: var(--ink); font-size: 14px; }
  .hotel .crit { display: flex; flex-wrap: wrap; gap: 4px; }
  .hotel .crit span { background: var(--chip); border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .hotel a.btn { margin-top: auto; text-align: center; background: #003b95; color: #fff; text-decoration: none;
                 font-weight: 600; padding: 8px 10px; border-radius: 8px; }
  .hotel a.btn:hover { background: #00296b; }
  .price { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .price small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .dest { font-size: 17px; font-weight: 600; }
  .dest .cc { color: var(--muted); font-weight: 400; }
  .when { color: var(--muted); font-size: 14px; }
  .legs { grid-column: 2; display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .leg { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 14px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); font-weight: 600; }
  .chip.fr { color: var(--fr); } .chip.wz { color: var(--wz); }
  .chip.oj { color: var(--good); }
  .leg a { color: var(--accent); text-decoration: none; margin-left: auto; white-space: nowrap; }
  .leg a:hover { text-decoration: underline; }
  .leg .lp { font-variant-numeric: tabular-nums; color: var(--muted); }
  .more { margin: 14px auto; display: block; }
  .more[hidden] { display: none; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  details { margin-top: 30px; color: var(--muted); font-size: 13px; }
  details pre { white-space: pre-wrap; background: var(--card); border: 1px solid var(--line);
                padding: 10px; border-radius: 10px; }
  @media (max-width: 900px) {
    .trip, .trip.noh { grid-template-columns: 110px 1fr; }
    .hotel { grid-column: 1 / -1; grid-row: auto; border-left: 0; border-top: 1px solid var(--line);
             padding: 10px 0 0; }
  }
  @media (max-width: 600px) {
    .trip, .trip.noh { grid-template-columns: 1fr; }
    .legs { grid-column: 1; }
    .leg a { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Tanie loty</h1>
  <div class="cities" id="cities"></div>
  <div class="sub" id="sub">Wczytuję wyniki…</div>
</header>
<main>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-t="rt" aria-selected="true">W obie strony<small id="n-rt"></small></button>
    <button class="tab" role="tab" data-t="oj" aria-selected="false">Open-jaw<small id="n-oj"></small></button>
    <button class="tab" role="tab" data-t="ow" aria-selected="false">W jedną stronę<small id="n-ow"></small></button>
  </div>

  <div class="filters">
    <label>Dorośli<select id="f-adults"></select></label>
    <label>Dzieci (2–11 lat)<select id="f-kids"></select></label>
    <label>Data wylotu<input id="f-out" type="date"></label>
    <label class="rt-only">Data powrotu<input id="f-in" type="date"></label>
    <label>Elastyczność dat<select id="f-flex">
      <option value="0">dokładnie ten dzień</option><option value="1">± 1 dzień</option>
      <option value="2">± 2 dni</option><option value="3">± 3 dni</option><option value="7">± 7 dni</option>
    </select></label>
    <label>Maks. cena za wszystkich (zł)<input id="f-max" type="number" min="0" step="10" placeholder="bez limitu"></label>
    <label class="rt-only">Noce od<select id="f-nmin"></select></label>
    <label class="rt-only">Noce do<select id="f-nmax"></select></label>
    <label>Miesiąc wylotu<select id="f-month"><option value="">wszystkie</option></select></label>
    <label>Wylot z<select id="f-orig"><option value="">wszystkie lotniska</option></select></label>
    <label>Przewoźnik<select id="f-car">
      <option value="">dowolny</option><option value="Ryanair">tylko Ryanair</option>
      <option value="Wizz Air">tylko Wizz Air</option><option value="mix" class="rt-only">mieszane linie</option>
    </select></label>
    <label>Kierunek / kraj<input id="f-q" type="search" placeholder="np. Hiszpania, BCN"></label>
    <label>Sortuj<select id="f-sort"><option value="price">od najtańszych lotów</option>
      <option value="cost" class="rt-only">wg kosztu loty + nocleg + dojazd</option>
      <option value="deal">największa okazja (vs średnia)</option><option value="date">wg daty</option></select></label>
    <label>Temp. w dzień<select id="f-temp"><option value="">dowolna</option><option value="15">min. 15°C</option>
      <option value="20">min. 20°C</option><option value="25">min. 25°C</option></select></label>
    <label class="check"><input id="f-deal" type="checkbox"> Tylko poniżej średniej ceny</label>
    <label class="check"><input id="f-weekend" type="checkbox"> Tylko weekendy</label>
    <label class="check"><input id="f-one" type="checkbox" checked> Jeden wynik na kierunek</label>
    <button class="tab reset" id="f-reset" type="button">Wyczyść filtry</button>
  </div>

  <div class="note" id="note" hidden></div>
  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <button class="tab more" id="more" hidden>Pokaż więcej</button>

  <details><summary>Szczegóły ostatniego wyszukiwania</summary><pre id="meta"></pre></details>
</main>

<script>
const $ = s => document.querySelector(s);
const DOW = ["nd", "pn", "wt", "śr", "cz", "pt", "sb"];
const MON = ["sty", "lut", "mar", "kwi", "maj", "cze", "lip", "sie", "wrz", "paź", "lis", "gru"];
let DATA = null, tab = "rt", shown = 60;

const d = s => new Date(s + "T12:00:00");
const fmtDay = s => { const x = d(s); return `${DOW[x.getDay()]} ${x.getDate()} ${MON[x.getMonth()]}`; };
const ap = c => (DATA.airports[c] || { code: c, city: c, country: "" });
const city = c => { const a = ap(c); return a.city || a.name || c; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

const pax = () => ({ a: +$("#f-adults").value || 1, k: +$("#f-kids").value || 0 });
const seats = () => { const p = pax(); return p.a + p.k; };

// Link do rezerwacji; gdy podano ret (ta sama linia, te same lotniska) — od razu w obie strony.
// --- pogoda ---------------------------------------------------------------------------
const WMO = c => c == null ? ["", ""] : c <= 1 ? ["☀️", "słonecznie"] : c <= 3 ? ["⛅", "zmienne zachmurzenie"]
  : c <= 48 ? ["🌫️", "mgliście"] : c <= 67 || (c >= 80 && c <= 82) ? ["🌧️", "deszczowo"] : c <= 77 || c <= 86 ? ["🌨️", "śnieg"] : ["⛈️", "burze"];
function weather(t) {
  const a = ap(t.dest), from = t.out.arr_date || t.out.date, to = t.ret ? t.ret.date : from;
  const fc = a.forecast || {};
  const days = Object.keys(fc).filter(k => k >= from && k <= to).map(k => fc[k]);
  if (days.length && days.length >= Math.min(2, Math.round((d(to) - d(from)) / 864e5) + 1)) {
    const avg = k => Math.round(days.reduce((s, x) => s + x[k], 0) / days.length);
    const codes = days.map(x => x.code ?? 0).sort((x, y) => x - y);
    const [ico, txt] = WMO(codes[Math.floor(codes.length / 2)]);
    const pp = Math.max(...days.map(x => x.pp ?? 0));
    return { tmax: avg("tmax"), html: `${ico} Prognoza: ${avg("tmax")}° / ${avg("tmin")}°, ${txt}${pp ? `, deszcz do ${pp}%` : ""}` };
  }
  const c = (a.climate || {})[from.slice(5, 7)];
  if (!c) return null;
  const ico = c.rain >= 10 ? "🌧️" : (c.sun ?? 0) >= 7 ? "☀️" : (c.sun ?? 0) >= 4 ? "⛅" : "☁️";
  return { tmax: c.tmax, html: `${ico} Zwykle w ${MON[+from.slice(5, 7) - 1]}: ${Math.round(c.tmax)}° / ${Math.round(c.tmin)}°`
    + `${c.sun != null ? ` · ${c.sun} h słońca/dzień` : ""} · ${Math.round(c.rain)} dni z deszczem/mies.` };
}

// --- szacunkowy koszt wyjazdu na osobę ----------------------------------------------------
function cost(t) {
  if (!t.ret || !DATA.cost || !DATA.cost.hotel_room_eur) return null;
  const nights = Math.max(1, Math.round((d(t.ret.date) - d(t.out.arr_date || t.out.date)) / 864e5));
  const cc = ap(t.dest).cc, pli = (DATA.pli || {})[cc] || 100, f = pli / 100 * (DATA.eur || 4.3);
  const { a } = pax(), n = seats(), rooms = Math.ceil(a / 2);
  const o = offerFor(t);
  const real = o && o.per_night ? o.per_night / roomsFor(o.adults) : null; // prawdziwa cena pokoju/noc dla kierunku
  const room = real || DATA.cost.hotel_room_eur * f;          // pokój / noc
  const lodging = rooms * room * nights / n;                  // nocleg na osobę
  const tr = transferPLN(t.dest) , tb = transferPLN(t.back || t.dest);
  const transfer = tr != null && tb != null ? Math.round(tr + tb) : null;   // przylot → centrum i centrum → lotnisko powrotu
  const exact = offerMatches(t, o) && o.adults === a && n === a;
  const lodgingPP = exact ? o.total / n : lodging;
  const access = grpOf(t).access_pln || 0;   // dojazd z domu do lotniska startowego
  const total = Math.round(t.total + lodgingPP + (transfer || 0) + access); // loty + nocleg + dojazdy na osobę
  return { total, room: Math.round(room), lodging: Math.round(lodgingPP), nights, pli, known: !!(DATA.pli || {})[cc],
           real: !!real, exact, transfer, access, ppn: Math.round(lodgingPP / nights) };
}

// --- dojazd z lotniska do centrum komunikacją publiczną --------------------------------------
const transferPLN = code => { const x = ap(code).transit; return x ? x.eur * (DATA.eur || 4.3) : null; };
function transitBadge(code) {
  const x = ap(code).transit;
  if (!x) return "";
  return `<span class="badge" title="Orientacyjnie, bilet normalny w jedną stronę (stan ok. 2025/26) — sprawdź przed wyjazdem">🚌 ${esc(code)} → ${esc(x.to)}: ok. ${Math.round(transferPLN(code))} zł/os., ${esc(x.mode)}, ~${x.min} min</span>`;
}

// --- cena na tle średniej i historii --------------------------------------------------------
function priceBadges(t) {
  const out = [];
  if (t.vs != null) {
    if (t.vs <= -10) out.push(`<span class="badge good" title="Mediana cen tego kierunku w przeszukanym okresie">▼ ${-t.vs}% taniej niż zwykle na tym kierunku</span>`);
    else if (t.vs >= 10) out.push(`<span class="badge bad" title="Mediana cen tego kierunku w przeszukanym okresie">▲ ${t.vs}% drożej niż zwykle</span>`);
    else out.push(`<span class="badge">cena typowa dla kierunku</span>`);
  }
  const legs = [t.out, t.ret].filter(Boolean), hs = legs.map(l => l.h).filter(Boolean);
  const chg = hs.reduce((s, h) => s + (h.chg || 0), 0);
  if (chg) out.push(`<span class="badge ${chg < 0 ? "good" : "bad"}">${chg < 0 ? "↓" : "↑"} ${Math.abs(chg)} zł/os. od ostatniego sprawdzenia</span>`);
  if (hs.length === legs.length && hs.every((h, i) => h.n >= 3 && legs[i].price <= h.min))
    out.push(`<span class="badge good">najniższa cena od ${fmtDay(hs[0].since)}</span>`);
  else if (hs.length === legs.length && hs.every(h => h.avg)) {
    const avg = hs.reduce((s, h) => s + h.avg, 0), now = legs.reduce((s, l) => s + l.price, 0);
    const pct = Math.round((now - avg) / avg * 100);
    if (Math.abs(pct) >= 5) out.push(`<span class="badge ${pct < 0 ? "good" : "bad"}" title="Średnia z ${hs[0].n} sprawdzeń od ${fmtDay(hs[0].since)}">${pct < 0 ? "" : "+"}${pct}% vs średnia tego terminu</span>`);
  }
  return out;
}

function bookUrl(l, ret) {
  const { a, k } = pax();
  if (l.carrier === "Ryanair")
    return `https://www.ryanair.com/pl/pl/trip/flights/select?adults=${a}&teens=0&children=${k}&infants=0`
      + `&dateOut=${l.date}${ret ? "&dateIn=" + ret.date : ""}&isConnectedFlight=false&isReturn=${!!ret}`
      + `&discount=0&originIata=${l.from}&destinationIata=${l.to}`;
  return `https://wizzair.com/pl-pl/booking/select-flight/${l.from}/${l.to}/${l.date}/${ret ? ret.date : "null"}/${a}/${k}/0/null`;
}
const sameTrip = t => t.ret && t.out.carrier === t.ret.carrier && t.out.from === t.ret.to && t.out.to === t.ret.from;

function times(l) {
  if (!l.time) return "";
  if (!l.arr) return `, wylot <b>${esc(l.time)}</b> <small>(godz. lądowania — sprawdź u przewoźnika)</small>`;
  return `, wylot <b>${esc(l.time)}</b> → lądowanie <b>${fmtDay(l.arr_date || l.date)}, ${esc(l.arr)}</b>`;
}

// Nocleg: link do Booking.com z kryteriami (≤3 km od centrum, bez hosteli, ocena 7+), od najtańszych.
const HT = [204, 201, 220, 216, 208, 213, 222, 206, 205]; // hotele, apartamenty, domy, pensjonaty, B&B, wille… (bez 203 = hostele)
function stay(t) {
  if (!t.ret) return null;
  const checkin = t.out.arr_date || t.out.date, checkout = t.ret.date;
  const nights = Math.round((d(checkout) - d(checkin)) / 86400000);
  if (nights < 1) return null;
  const a = ap(t.dest), { a: ad, k } = pax();
  const nflt = ["distance=3000", "review_score=70", "roomfacility=38", ...HT.map(h => "ht_id=" + h)].join(";"); // 38 = łazienka w pokoju
  const q = new URLSearchParams({ ss: [city(t.dest), a.country].filter(Boolean).join(", "), checkin, checkout,
    group_adults: ad, group_children: k, no_rooms: 1, order: "price", nflt, lang: "pl" });
  for (let i = 0; i < k; i++) q.append("age", 8);
  return { url: "https://www.booking.com/searchresults.pl.html?" + q, checkin, checkout, nights, city: city(t.dest) };
}

// Prawdziwa oferta z LiteAPI dla kierunku (najtańsza spełniająca kryteria), jeśli jest.
const offerFor = t => { const o = (DATA.hotels || {})[t.dest]; return o && !o.sandbox ? o : null; };
const sandboxFor = t => { const o = (DATA.hotels || {})[t.dest]; return o && o.sandbox ? o : null; };
const offerMatches = (t, o) => o && o.checkin === (t.out.arr_date || t.out.date) && o.checkout === (t.ret && t.ret.date);
const roomsFor = n => Math.max(1, Math.ceil(n / 2));

function hotelBox(t) {
  const h = stay(t);
  if (!h) return "";
  const sb = sandboxFor(t);
  const sbNote = offerMatches(t, sb) ? `<span style="color:#c0392b">Test LiteAPI (klucz sandbox): ${esc(sb.name)}, ${sb.total} zł — dane przykładowe, nie prawdziwa cena</span>` : "";
  const o = offerFor(t);
  if (offerMatches(t, o)) {
    const q = new URLSearchParams({ ss: `${o.name}, ${h.city}`, checkin: o.checkin, checkout: o.checkout,
      group_adults: pax().a, group_children: pax().k, no_rooms: 1, lang: "pl" });
    const stars = o.stars ? " · " + "★".repeat(Math.round(o.stars)) : "";
    return `<div class="hotel"><b>Najtańszy nocleg: ${esc(o.name)}</b>
      <span>${o.rating5 ? `TripAdvisor ${o.rating5}/5` : `ocena ${o.rating}/10`}${o.reviews ? ` (${o.reviews} opinii)` : ""}${stars} · ${o.km} km od centrum${o.type ? " · " + esc(o.type) : ""}</span>
      ${o.room || o.board ? `<span>${esc(o.room || "")}${o.board ? " · " + esc(o.board) : ""}</span>` : ""}
      ${o.site ? `<span>najtaniej w: ${esc(o.site)}</span>` : ""}
      <span><b>${o.total.toLocaleString("pl-PL")} zł</b> za ${o.nights} ${o.nights === 1 ? "noc" : o.nights < 5 ? "noce" : "nocy"}
        (${o.per_night} zł/noc, ≈ ${Math.round(o.per_night / o.adults)} zł/os./noc) · dla ${o.adults} dorosłych</span>
      <div class="crit"><span>≤ 3 km</span><span>bez hosteli</span><span>${o.rating5 ? "3,5/5+" : "7+"}</span>${o.rating5 ? `<span title="Xotelo nie podaje typu pokoju">łazienkę sprawdź przy rezerwacji</span>` : "<span>łazienka w pokoju</span>"}</div>
      <a class="btn" href="${esc(o.url || "https://www.booking.com/searchresults.pl.html?" + q)}" target="_blank" rel="noopener">${o.url ? "Zobacz obiekt i ceny ↗" : "Znajdź ten obiekt ↗"}</a>
      <a href="${esc(h.url)}" target="_blank" rel="noopener" style="text-align:center;font-size:12px;color:var(--accent)">albo porównaj na Booking.com ↗</a></div>`;
  }
  const { a, k } = pax();
  const who = `${a} ${a === 1 ? "dorosły" : "dorosłych"}${k ? `, ${k} ${k === 1 ? "dziecko" : "dzieci"}` : ""}`;
  return `<div class="hotel"><b>Nocleg: ${esc(h.city)}</b>
    <span>${fmtDay(h.checkin)} → ${fmtDay(h.checkout)} · ${h.nights} ${h.nights === 1 ? "noc" : h.nights < 5 ? "noce" : "nocy"} · ${who}</span>
    ${sbNote}
    ${cost(t) ? `<span>${cost(t).real ? `Na podstawie oferty z ${fmtDay(o.checkin)}: pokój ok. ${cost(t).room} zł/noc (≈ ${cost(t).ppn} zł/os./noc)` : `Szacunek: pokój ok. ${cost(t).room} zł/noc (≈ ${cost(t).ppn} zł/os./noc)`}</span>` : ""}
    <div class="crit"><span>≤ 3 km od centrum</span><span>bez hosteli</span><span>ocena 7+</span><span>łazienka w pokoju</span><span>od najtańszych</span></div>
    <a class="btn" href="${esc(h.url)}" target="_blank" rel="noopener">Najtańszy nocleg na Booking.com ↗</a></div>`;
}

function leg(l, label) {
  const cls = l.carrier === "Ryanair" ? "fr" : "wz";
  return `<div class="leg"><span class="chip ${cls}">${esc(l.carrier)}</span>
    <span>${label} <b>${esc(l.from)}</b> → <b>${esc(l.to)}</b>: ${fmtDay(l.date)}${times(l)}</span>
    <span class="lp">${l.price} zł/os.${l.orig ? " (" + esc(l.orig) + ")" : ""}</span>
    <a href="${esc(bookUrl(l))}" target="_blank" rel="noopener">Sprawdź ↗</a></div>`;
}

function card(t) {
  const a = ap(t.dest);
  let title = `${esc(city(t.dest))} <span class="cc">${esc(a.country)} · ${esc(t.dest)}</span>`;
  let when = fmtDay(t.out.date);
  if (t.ret) when += ` → ${fmtDay(t.ret.date)} · ${t.nights} ${t.nights === 1 ? "noc" : t.nights < 5 ? "noce" : "nocy"}`;
  let extra = "";
  if (t.type === "oj") extra = ` <span class="chip oj">powrót z ${esc(city(t.back))} (${esc(t.back)}), ${t.km} km</span>`;
  const hb = hotelBox(t), w = weather(t), c = cost(t), cen = ap(t.dest).centre;
  const badges = [...priceBadges(t)];
  if (w) badges.push(`<span class="badge">${w.html}</span>`);
  if (cen) badges.push(`<span class="badge" title="Odległość w linii prostej">✈ lotnisko ok. ${Math.round(cen.km)} km od centrum ${esc(cen.name)}</span>`);
  const grp = grpOf(t);
  const cmp = !MERGED && COMPARE && COMPARE.dests[t.dest];
  if (cmp && t.type === "rt" && grp.code) {
    const others = Object.keys(cmp).filter(k => k !== grp.code);
    if (!others.length) badges.push(`<span class="badge good">tylko z: ${esc(grp.name)}</span>`);
    for (const k of others) {
      const mine = t.total + (grp.access_pln || 0), theirs = cmp[k].with_access, g2 = COMPARE.groups[k];
      if (theirs + 20 < mine) badges.push(`<span class="badge bad" title="Najtańszy wyjazd na ten kierunek, łącznie z dojazdem do lotniska">z: ${esc(g2.name)} od ${theirs} zł/os. (z dojazdem)</span>`);
    }
  }
  if (MERGED) badges.unshift(`<span class="badge ${grp.access_pln ? "bad" : ""}" style="font-weight:600">✈ wylot: ${esc(grp.name)}${grp.access_pln ? ` · +${grp.access_pln} zł/os. dojazd z Warszawy (tam i z powrotem)` : ""}</span>`);
  else if (grp.access_pln) badges.push(`<span class="badge" title="${esc(grp.access_note)}">🚆 dojazd do ${esc(grp.name)}: ok. ${grp.access_pln} zł/os. tam i z powrotem</span>`);
  if (transitBadge(t.dest)) badges.push(transitBadge(t.dest));
  if (t.back && t.back !== t.dest && transitBadge(t.back)) badges.push(transitBadge(t.back));
  return `<div class="trip${hb ? "" : " noh"}">
    <div class="price">${t.total * seats()}<small> zł</small>${seats() > 1 ? `<span class="pp">${t.total} zł/os. × ${seats()}</span>` : ""}${c ? `<span class="cost" title="Na osobę: loty ${t.total} zł + nocleg ${c.lodging} zł (${c.nights} ${c.nights === 1 ? "noc" : "nocy"}, ok. ${c.ppn} zł/os./noc, pokój ok. ${c.room} zł/noc — ${c.exact ? "prawdziwa najtańsza oferta spełniająca kryteria" : c.real ? "na podstawie prawdziwej oferty w tym mieście z innego terminu" : `szacunek z poziomu cen kraju ${c.pli}${c.known ? "" : ", brak danych — średnia UE"}; UE = 100`})${c.transfer != null ? ` + dojazd lotnisko↔centrum ${c.transfer} zł (komunikacja publiczna, tam i z powrotem)` : ""}${c.access ? ` + dojazd do lotniska startowego ${c.access} zł (${grpOf(t).access_note})` : ""}.">Loty + nocleg${c.transfer != null ? " + dojazd" : ""} ${c.exact ? "=" : "≈"} ${c.total.toLocaleString("pl-PL")} zł<small>/os. ${c.exact ? "(prawdziwe ceny)" : c.real ? "(nocleg wg oferty z innego terminu)" : "(nocleg szacunkowo)"}</small></span>` : ""}</div>
    <div><div class="dest">${title}</div><div class="when">${when}${extra}</div>${badges.length ? `<div class="badges">${badges.join("")}</div>` : ""}</div>
    <div class="legs">${leg(t.out, "Wylot")}${t.ret ? leg(t.ret, "Powrót") : ""}
    ${sameTrip(t) ? `<div class="book"><a href="${esc(bookUrl(t.out, t.ret))}" target="_blank" rel="noopener">Sprawdź w obie strony w ${esc(t.out.carrier)} ↗</a></div>` : ""}</div>
    ${hb}</div>`;
}

function filtered() {
  const max = (+$("#f-max").value || Infinity) / seats(), nmin = +$("#f-nmin").value, nmax = +$("#f-nmax").value;
  const flex = +$("#f-flex").value, dOut = validDate("#f-out"), dIn = tab === "ow" ? "" : validDate("#f-in");
  const near = (a, b) => Math.abs(d(a) - d(b)) <= flex * 86400000 + 3600000;
  const month = $("#f-month").value, orig = $("#f-orig").value, car = $("#f-car").value;
  const q = $("#f-q").value.trim().toLowerCase(), wk = $("#f-weekend").checked, one = $("#f-one").checked;
  const tmin = +$("#f-temp").value || null, deal = $("#f-deal").checked;
  let rows = DATA[tab].filter(t => {
    if (eff(t) > max) return false;
    // filtr nocy działa zawsze — przy elastycznych datach wyznacza długość pobytu
    if (t.ret && (t.nights < nmin || t.nights > nmax)) return false;
    if (dOut && !near(t.out.date, dOut)) return false;
    if (dIn && t.ret && !near(t.ret.date, dIn)) return false;
    if (month && !t.out.date.startsWith(month)) return false;
    if (orig && t.out.from !== orig) return false;
    if (car === "mix" && (!t.ret || t.out.carrier === t.ret.carrier)) return false;
    if (car && car !== "mix" && (t.out.carrier !== car || (t.ret && t.ret.carrier !== car))) return false;
    if (wk) {
      const o = d(t.out.date).getDay();
      if (![4, 5, 6].includes(o)) return false;
      if (t.ret && ![0, 1].includes(d(t.ret.date).getDay())) return false;
    }
    if (deal && !(t.vs < 0)) return false;
    if (tmin) { const w = weather(t); if (!w || w.tmax < tmin) return false; }
    if (q) {
      const hay = [t.dest, t.back, city(t.dest), ap(t.dest).country, t.back && city(t.back)].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const sort = $("#f-sort").value;
  if (sort === "cost" && tab !== "ow") {
    const cache = new Map(rows.map(t => [t, (cost(t) || { total: Infinity }).total]));
    rows.sort((a, b) => cache.get(a) - cache.get(b));
  } else if (sort === "deal") rows.sort((a, b) => (a.vs ?? 0) - (b.vs ?? 0) || a.total - b.total);
  else if (sort === "date") rows.sort((a, b) => a.out.date.localeCompare(b.out.date) || eff(a) - eff(b));
  else rows.sort((a, b) => eff(a) - eff(b) || a.out.date.localeCompare(b.out.date));
  if (one) {
    const seen = new Set();
    rows = rows.filter(t => { const k = t.dest + "|" + (t.back || ""); if (seen.has(k)) return false; seen.add(k); return true; });
  }
  return rows;
}

// Grupa (miasto wylotu) danego wyjazdu i cena porównawcza: loty + dojazd do lotniska startowego
const grpOf = t => t.grp || DATA.meta.config.group || {};
const eff = t => t.total + (grpOf(t).access_pln || 0);

// Zwraca datę tylko, jeśli mieści się w przeszukanym okresie; inaczej pokazuje ostrzeżenie.
let warnings = [];
function validDate(id) {
  const v = $(id).value;
  if (!v) return "";
  const [w0, w1] = DATA.meta.window;
  if (v < w0 || v > w1) {
    // pomyłka w roku (np. 2026 zamiast 2027): jeśli ten sam dzień w innym roku mieści się w okresie — użyj go
    for (const dy of [1, -1]) {
      const alt = String(+v.slice(0, 4) + dy) + v.slice(4);
      if (alt >= w0 && alt <= w1) {
        warnings.push(`Data ${v.split("-").reverse().join(".")} — zakładam rok ${alt.slice(0, 4)}.`);
        return alt;
      }
    }
    warnings.push(`Data ${v.split("-").reverse().join(".")} jest poza przeszukanym okresem (${fmtDay(w0)} – ${fmtDay(w1)} ${w1.slice(0, 4)}) — pomijam ją. Sprawdź rok.`);
    return "";
  }
  return v;
}

function render() {
  warnings = [];
  document.querySelectorAll(".rt-only").forEach(e => e.style.display = tab === "ow" ? "none" : "");
  const rows = filtered();
  const c = DATA.meta.config, o = validDate("#f-out"), i = tab === "ow" ? "" : validDate("#f-in");
  warnings = [...new Set(warnings)];
  if (o && i) {
    const n = Math.round((d(i) - d(o)) / 86400000);
    if (n < 0) warnings.push("Data powrotu jest wcześniejsza niż data wylotu.");
    else if (n - +$("#f-flex").value > c.nights_max || n + +$("#f-flex").value < c.nights_min)
      warnings.push(`Wyszukiwarka zbiera pobyty ${c.nights_min}–${c.nights_max} nocy, a wybrane daty dają ${n}. `
        + `Dłuższe pobyty: zmień „nights_max” w config.json albo przy ręcznym uruchomieniu (Run workflow).`);
  }
  if (seats() > 1) warnings.push(`Ceny × ${seats()} os. — to szacunek: najtańszych miejsc może nie starczyć dla wszystkich. `
    + `Linki „Sprawdź” otwierają rezerwację od razu z wybraną liczbą osób.`);
  $("#note").hidden = !warnings.length;
  $("#note").innerHTML = warnings.map(esc).join("<br>");
  $("#count").textContent = rows.length ? `${rows.length} wyników` : "";
  $("#list").innerHTML = rows.length ? rows.slice(0, shown).map(card).join("")
    : `<div class="empty">Brak wyników dla tych filtrów.</div>`;
  $("#more").hidden = rows.length <= shown;
}

// Rozpakowanie formatu zwartego (format 2): [wylot, powrót, kierunek, powrót z, noce, suma, vs, km]
function unpack(data) {
  if (data.format !== 2 || data._unpacked) return data;
  data._unpacked = true;
  const L = data.legs;
  for (const [kind, type] of [["rt", "rt"], ["oj", "oj"], ["ow", "ow"]]) {
    data[kind] = data[kind].map(r => {
      const t = { type, out: L[r[0]], dest: r[2], total: r[5] };
      if (r[1] >= 0) t.ret = L[r[1]];
      if (r[3]) t.back = r[3];
      if (r[4]) t.nights = r[4];
      if (r[6] != null) t.vs = r[6];
      if (r[7] != null) t.km = r[7];
      return t;
    });
  }
  return data;
}

function init(data) {
  DATA = unpack(data);
  data = DATA;
  const m = data.meta, c = m.config;
  const when = new Date(m.generated).toLocaleString("pl-PL", { dateStyle: "medium", timeStyle: "short" });
  $("#sub").textContent = `Aktualizacja: ${when} · loty ${fmtDay(m.window[0])} – ${fmtDay(m.window[1])} · z ${c.origins.join(", ")}`;
  for (const k of ["rt", "oj", "ow"]) $("#n-" + k).textContent = data[k].length;
  for (let n = c.nights_min; n <= c.nights_max; n++) {
    $("#f-nmin").add(new Option(n, n)); $("#f-nmax").add(new Option(n, n));
  }
  $("#f-nmax").value = c.nights_max;
  for (const id of ["#f-out", "#f-in"]) { $(id).min = m.window[0]; $(id).max = m.window[1]; }
  for (let n = 1; n <= 9; n++) $("#f-adults").add(new Option(n, n));
  for (let n = 0; n <= 6; n++) $("#f-kids").add(new Option(n, n));
  c.origins.forEach(o => $("#f-orig").add(new Option(`${o} – ${city(o)}`, o)));
  const months = new Set(); ["rt", "oj", "ow"].forEach(k => data[k].forEach(t => months.add(t.out.date.slice(0, 7))));
  [...months].sort().forEach(mm => { const [y, mo] = mm.split("-"); $("#f-month").add(new Option(`${MON[+mo - 1]} ${y}`, mm)); });
  $("#meta").textContent = m.providers.map(p => `${p.name}: ${p.routes} tras, ${p.fares} cen${p.notes.length ? " — " + p.notes.join("; ") : ""}`).join("\n")
    + `\nKursy walut: ${m.fx}\nCzas wyszukiwania: ${m.seconds} s\nHTTP: ${JSON.stringify(m.http)}`
    + `\nOpen-jaw: lotniska do ${c.openjaw_km} km od siebie`
    + `\nDodatki: ${(m.enrich || []).join("; ")}`
    + `\nLoty + nocleg: loty dokładnie, nocleg szacunkowo — pokój ${data.cost.hotel_room_eur} €/noc przy średnich cenach UE, `
    + `przeliczane wskaźnikiem cen restauracji i hoteli kraju (${m.pli_source}). Parametry: config.json → cost.`
    + `\nPogoda: Open-Meteo (średnie z 3 lat; prognoza dla terminów w ciągu 16 dni).`;
  render();
}

document.querySelectorAll(".tab[data-t]").forEach(b => b.onclick = () => {
  tab = b.dataset.t; shown = 60;
  document.querySelectorAll(".tab[data-t]").forEach(x => x.setAttribute("aria-selected", x === b));
  render();
});
document.querySelectorAll(".filters input, .filters select").forEach(e => e.oninput = () => { shown = 60; render(); });
$("#f-reset").onclick = () => {
  document.querySelectorAll(".filters input[type=date], .filters input[type=number], .filters input[type=search]").forEach(e => e.value = "");
  ["#f-month", "#f-orig", "#f-car", "#f-temp"].forEach(id => $(id).value = "");
  $("#f-deal").checked = false; $("#f-sort").value = "price";
  $("#f-flex").value = "0"; $("#f-adults").value = "1"; $("#f-kids").value = "0";
  $("#f-nmin").selectedIndex = 0; $("#f-nmax").selectedIndex = $("#f-nmax").options.length - 1;
  $("#f-weekend").checked = false; $("#f-one").checked = true; shown = 60; render();
};
$("#more").onclick = () => { shown += 60; render(); };

let COMPARE = null;
fetch("compare.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(c => { COMPARE = c; if (DATA) render(); }).catch(() => {});
// Miasto wylotu: ?z=WAW / ?z=KRK; bez parametru — widok „Razem” (wszystkie miasta na jednej liście)
const GROUP = (new URLSearchParams(location.search).get("z") || "ALL").toUpperCase();
let MERGED = false;
const getJSON = url => fetch(url, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(url); return r.json(); });

function cityLinks(cfg, cur) {
  const groups = Object.entries(cfg.groups || {}).filter(([k]) => !k.startsWith("_"));
  const names = groups.map(([, g]) => g.name);
  $("#title").textContent = cur === "ALL" ? `Tanie loty z: ${names.join(" + ")}` : `Tanie loty z: ${(cfg.groups[cur] || {}).name || cur}`;
  $("#cities").innerHTML = [`<a href="./" class="${cur === "ALL" ? "on" : ""}">✈ Razem</a>`].concat(groups.map(([k, g]) =>
    `<a href="?z=${k}" class="${k === cur ? "on" : ""}">${esc(g.name)}${g.access_pln ? ` <small>(+${g.access_pln} zł dojazd)</small>` : ""}</a>`)).join("");
}

// Łączy wyniki kilku miast: każdy wyjazd dostaje swoje miasto wylotu (t.grp).
function merge(list) {
  const base = list[0];
  for (const d of list) {
    const g = d.meta.config.group || {};
    for (const k of ["rt", "oj", "ow"]) d[k].forEach(t => t.grp = g);
  }
  const out = { ...base, meta: { ...base.meta, config: { ...base.meta.config } } };
  for (const k of ["rt", "oj", "ow"]) out[k] = list.flatMap(d => d[k]);
  out.airports = Object.assign({}, ...list.map(d => d.airports));
  out.hotels = Object.assign({}, ...list.map(d => d.hotels || {}));
  out.pli = Object.assign({}, ...list.map(d => d.pli || {}));
  out.meta.config.origins = [...new Set(list.flatMap(d => d.meta.config.origins))];
  out.meta.providers = list.flatMap(d => d.meta.providers.map(p => ({ ...p, name: `${(d.meta.config.group || {}).code || ""} ${p.name}` })));
  out.meta.enrich = list.flatMap(d => d.meta.enrich || []);
  delete out.meta.config.group;
  return out;
}

getJSON("results.json").then(async d0 => {
  const cfg = d0.meta.config, groups = Object.keys(cfg.groups || {}).filter(k => !k.startsWith("_"));
  const def = cfg.default_group || "WAW";
  cityLinks(cfg, groups.includes(GROUP) ? GROUP : "ALL");
  if (groups.includes(GROUP)) return init(GROUP === def ? d0 : await getJSON(`results-${GROUP}.json`));
  const others = await Promise.all(groups.filter(k => k !== def).map(k => getJSON(`results-${k}.json`).catch(() => null)));
  const list = [unpack(d0), ...others.filter(Boolean).map(unpack)];
  MERGED = list.length > 1;
  init(MERGED ? merge(list) : list[0]);
}).catch(() => { $("#sub").textContent = "Nie udało się wczytać wyników — wyszukiwanie może jeszcze trwać."; });
</script>
</body>
</html>
